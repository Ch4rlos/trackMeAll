name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests de dominio (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar el Xcode más reciente del runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version

      - name: Tests TMACore
        run: swift test --package-path Packages/TMACore

      - name: Tests TMASecurity
        run: swift test --package-path Packages/TMASecurity

  build:
    name: Build de la app (simulador iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar el Xcode más reciente del runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto
        run: xcodegen generate

      - name: Elegir un simulador disponible
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available --json | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];n=[x["name"] for v in d.values() for x in v if x["name"].startswith("iPhone")];print(n[0] if n else "")')
          if [ -z "$NAME" ]; then echo "No hay simulador de iPhone en el runner" >&2; exit 1; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Simulador: $NAME"

      - name: Build
        run: |
          xcodebuild -project trackMeAll.xcodeproj -scheme trackMeAll \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
