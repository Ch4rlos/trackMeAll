name: trackMeAll
options:
  bundleIdPrefix: com.carlosquiroga
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  TMACore:
    path: Packages/TMACore
  TMASalud:
    path: Packages/TMASalud
  TMAFinanzas:
    path: Packages/TMAFinanzas
  TMAActividades:
    path: Packages/TMAActividades
  TMABlog:
    path: Packages/TMABlog
  TMASecurity:
    path: Packages/TMASecurity
  TMABonanzas:
    path: Packages/TMABonanzas

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  trackMeAll:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: trackMeAll
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "Face ID desbloquea trackMeAll y protege tus datos."
        NSUserActivityTypes:
          - com.carlosquiroga.trackmeall.section
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: "trackMeAll lee pasos, frecuencia cardiaca, sueño, entrenamientos y ánimo para la sección Salud."
        NSHealthUpdateUsageDescription: "trackMeAll registra ánimo y datos de alimentación que tú captures."
        NSLocationWhenInUseUsageDescription: "trackMeAll usa tu ubicación para registrar los lugares donde estuviste."
        NSLocationAlwaysAndWhenInUseUsageDescription: "trackMeAll registra visitas a lugares aunque la app esté cerrada."
        NSCalendarsFullAccessUsageDescription: "trackMeAll lee tu agenda para mostrarla en Actividades."
        NSMotionUsageDescription: "trackMeAll usa el movimiento para distinguir actividad de reposo."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carlosquiroga.trackmeall
        PRODUCT_NAME: trackMeAll
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: TMACore
      - package: TMASalud
      - package: TMAFinanzas
      - package: TMAActividades
      - package: TMABlog
      - package: TMASecurity
      - package: TMABonanzas

schemes:
  trackMeAll:
    build:
      targets:
        trackMeAll: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
