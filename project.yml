name: trackMeAll
options:
  bundleIdPrefix: com.carlosquiroga
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  TMACore:
    path: Packages/TMACore
  TMASalud:
    path: Packages/TMASalud
  TMAFinanzas:
    path: Packages/TMAFinanzas
  TMAActividades:
    path: Packages/TMAActividades
  TMABlog:
    path: Packages/TMABlog

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  trackMeAll:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carlosquiroga.trackmeall
        PRODUCT_NAME: trackMeAll
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: trackMeAll
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: TMACore
      - package: TMASalud
      - package: TMAFinanzas
      - package: TMAActividades
      - package: TMABlog

schemes:
  trackMeAll:
    build:
      targets:
        trackMeAll: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
